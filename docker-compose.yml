services:
  db:
    image: postgres:16-alpine
    container_name: commonwealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: commonwealth
    ports:
      - "5432:5432"
    volumes:
      - commonwealth_pgdata:/var/lib/postgresql/data

volumes:
  commonwealth_pgdata:
